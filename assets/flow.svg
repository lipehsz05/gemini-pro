<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-labelledby="title desc">
  <title id="title">Fluxo de integração</title>
  <desc id="desc">Cliente, depois Loja ou sistema do revendedor, depois API Assinex, depois Processamento do pedido, depois Entrega ou ativação.</desc>
  <defs>
    <clipPath id="frame"><rect width="1280" height="340" rx="22"/></clipPath>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#f0f6fc" stroke-opacity="0.045"/>
    </pattern>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#3AA8E8" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#3AA8E8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hl" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4796E3"/>
      <stop offset="1" stop-color="#3AA8E8"/>
    </linearGradient>
    <style>
      .sans { font-family: "Segoe UI", Inter, -apple-system, Helvetica, Arial, sans-serif; }
      .mono { font-family: "JetBrains Mono", "SFMono-Regular", Consolas, Menlo, monospace; }
      .ico { fill: none; stroke: #9aa5b4; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
      .dot { animation: travel 2.4s cubic-bezier(.65,0,.35,1) infinite; }
      .d1 { animation-delay: 0s; } .d2 { animation-delay: .5s; } .d3 { animation-delay: 1s; } .d4 { animation-delay: 1.5s; }
      @keyframes travel { 0% { transform: translateX(0); opacity: 0; } 20% { opacity: 1; } 80% { opacity: 1; } 100% { transform: translateX(30px); opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="340" fill="#07090d"/>
    <rect width="1280" height="340" fill="url(#grid)"/>
    <circle cx="640" cy="190" r="260" fill="url(#glow)"/>

    <g class="mono" font-size="13" letter-spacing="1.5" fill="#6e7886">
      <text x="30" y="44"><tspan fill="#3AA8E8">→</tspan>  FLUXO DE UM PEDIDO</text>
      <text x="1250" y="44" text-anchor="end">diagrama conceitual</text>
    </g>

    <!-- conectores -->
    <g stroke="#f0f6fc" stroke-opacity="0.2" stroke-width="1.5">
      <line x1="250" y1="190" x2="280" y2="190"/>
      <line x1="500" y1="190" x2="530" y2="190"/>
      <line x1="750" y1="190" x2="780" y2="190"/>
      <line x1="1000" y1="190" x2="1030" y2="190"/>
    </g>
    <g fill="#3AA8E8">
      <circle cx="250" cy="190" r="4" class="dot d1"/>
      <circle cx="500" cy="190" r="4" class="dot d2"/>
      <circle cx="750" cy="190" r="4" class="dot d3"/>
      <circle cx="1000" cy="190" r="4" class="dot d4"/>
    </g>

    <!-- 1 · Cliente -->
    <g class="sans">
      <rect x="30" y="80" width="220" height="220" rx="16" fill="#0d1117" stroke="#f0f6fc" stroke-opacity="0.1"/>
      <rect x="50" y="100" width="48" height="48" rx="11" fill="#121821" stroke="#f0f6fc" stroke-opacity="0.14"/>
      <g transform="translate(62 112)" class="ico"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></g>
      <text x="50" y="186" class="mono" font-size="12" letter-spacing="1" fill="#6e7886">PASSO 1</text>
      <text x="50" y="214" font-size="19" font-weight="600" fill="#e6edf3">Cliente</text>
      <text x="50" y="248" font-size="15" fill="#9aa5b4">Compra no canal</text>
      <text x="50" y="270" font-size="15" fill="#9aa5b4">do revendedor.</text>
    </g>

    <!-- 2 · Loja / Sistema -->
    <g class="sans">
      <rect x="280" y="80" width="220" height="220" rx="16" fill="#0d1117" stroke="#f0f6fc" stroke-opacity="0.1"/>
      <rect x="300" y="100" width="48" height="48" rx="11" fill="#121821" stroke="#f0f6fc" stroke-opacity="0.14"/>
      <g transform="translate(312 112)" class="ico"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></g>
      <text x="300" y="186" class="mono" font-size="12" letter-spacing="1" fill="#6e7886">PASSO 2</text>
      <text x="300" y="214" font-size="19" font-weight="600" fill="#e6edf3">Loja / Sistema</text>
      <text x="300" y="248" font-size="15" fill="#9aa5b4">Registra a venda e</text>
      <text x="300" y="270" font-size="15" fill="#9aa5b4">aciona a integração.</text>
    </g>

    <!-- 3 · API Assinex (destaque) -->
    <g class="sans">
      <rect x="530" y="80" width="220" height="220" rx="16" fill="#0b1724" stroke="url(#hl)" stroke-width="1.5"/>
      <rect x="550" y="100" width="128" height="48" rx="11" fill="#0A7FC2" fill-opacity="0.14" stroke="#3AA8E8" stroke-opacity="0.45"/>
      <text x="614" y="131" text-anchor="middle" font-size="19" font-weight="800" font-style="italic" letter-spacing="-0.6"><tspan fill="#e6edf3">ASSIN</tspan><tspan fill="#3AA8E8">EX</tspan></text>
      <text x="550" y="186" class="mono" font-size="12" letter-spacing="1" fill="#3AA8E8">PASSO 3</text>
      <text x="550" y="214" font-size="19" font-weight="600" fill="#3AA8E8">API Assinex</text>
      <text x="550" y="248" font-size="15" fill="#9aa5b4">Recebe a solicitação</text>
      <text x="550" y="270" font-size="15" fill="#9aa5b4">de pedido.</text>
    </g>

    <!-- 4 · Processamento -->
    <g class="sans">
      <rect x="780" y="80" width="220" height="220" rx="16" fill="#0d1117" stroke="#f0f6fc" stroke-opacity="0.1"/>
      <rect x="800" y="100" width="48" height="48" rx="11" fill="#121821" stroke="#f0f6fc" stroke-opacity="0.14"/>
      <g transform="translate(812 112)" class="ico"><rect width="16" height="16" x="4" y="4" rx="2"/><rect width="6" height="6" x="9" y="9" rx="1"/><path d="M15 2v2M15 20v2M2 15h2M2 9h2M20 15h2M20 9h2M9 2v2M9 20v2"/></g>
      <text x="800" y="186" class="mono" font-size="12" letter-spacing="1" fill="#6e7886">PASSO 4</text>
      <text x="800" y="214" font-size="19" font-weight="600" fill="#e6edf3">Processamento</text>
      <text x="800" y="248" font-size="15" fill="#9aa5b4">O pedido é processado</text>
      <text x="800" y="270" font-size="15" fill="#9aa5b4">pela plataforma.</text>
    </g>

    <!-- 5 · Entrega / ativação -->
    <g class="sans">
      <rect x="1030" y="80" width="220" height="220" rx="16" fill="#0d1117" stroke="#f0f6fc" stroke-opacity="0.1"/>
      <rect x="1050" y="100" width="48" height="48" rx="11" fill="#3fb950" fill-opacity="0.1" stroke="#3fb950" stroke-opacity="0.35"/>
      <g transform="translate(1062 112)" class="ico" style="stroke:#3fb950"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></g>
      <text x="1050" y="186" class="mono" font-size="12" letter-spacing="1" fill="#6e7886">PASSO 5</text>
      <text x="1050" y="214" font-size="18" font-weight="600" letter-spacing="-0.3" fill="#e6edf3">Entrega / ativação</text>
      <text x="1050" y="248" font-size="15" fill="#9aa5b4">O acesso retorna e</text>
      <text x="1050" y="270" font-size="15" fill="#9aa5b4">chega ao cliente.</text>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="1279" height="339" rx="21.5" fill="none" stroke="#f0f6fc" stroke-opacity="0.1"/>
</svg>
